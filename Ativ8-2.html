<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro Geral</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <form>
        <fieldset class="principal">
            <legend>Cadastro Geral</legend>

            <div class="linha">
                <fieldset>
                    <legend>Dados pessoais</legend>
                    <label>Nome completo:</label><br>
                    <input type="text"><br><br>
                    <label>Profissão:</label><br>
                    <select>
                        <option>Sua profissão</option>
                    </select>
                </fieldset>

                <fieldset>
                    <legend>Localização</legend>
                    <label>E-mail:</label><br>
                    <input type="email"><br><br>
                    <label>Rua:</label><br>
                    <input type="text">
                </fieldset>
            </div>

            <fieldset>
                <legend>Faixa etária</legend>
                <div class="colunas">
                    <div>
                        <label><input type="radio" name="idade"> até 20 anos</label><br>
                        <label><input type="radio" name="idade"> mais de 20 até 30 anos</label><br>
                        <label><input type="radio" name="idade"> mais de 30 até 40 anos</label>
                    </div>
                    <div>
                        <label><input type="radio" name="idade"> mais de 40 até 50 anos</label><br>
                        <label><input type="radio" name="idade"> mais de 50 até 60 anos</label><br>
                        <label><input type="radio" name="idade"> mais de 60</label>
                    </div>
                </div>
            </fieldset>

            <fieldset>
                <legend>Esportes que pratica</legend>
                <label><input type="checkbox"> Futebol de campo</label><br>
                <label><input type="checkbox"> Futebol de salão</label><br>
                <label><input type="checkbox"> Futebol society</label><br>
                <label><input type="checkbox"> Volley de quadra</label><br>
                <label><input type="checkbox"> Volley de praia</label><br>
                <label><input type="checkbox"> Natação em piscina</label><br>
                <label><input type="checkbox"> Natação em mar aberto</label>
            </fieldset>

            <fieldset>
                <legend>Comentário</legend>
                <label>Mensagem:</label><br>
                <textarea rows="5"></textarea>
            </fieldset>

            <button type="submit">Enviar</button>
            <button type="reset">Limpar</button>
        </fieldset>
    </form>

</body>
</html>
